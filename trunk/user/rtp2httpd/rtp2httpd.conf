#RTP2HTTPD 配置文件
# 源码：https://github.com/stackia/rtp2httpd（选项名保持英文，仅注释翻译为中文）

# 所有空行以及以 # 或 ; 开头的行都会被忽略
[global]
#全局选项
#以下选项均可被命令行参数覆盖

#日志详细程度：0-安静 1-错误 2-警告 3-信息 4-调试（默认 1）
verbosity = 1

# 访问日志文件路径（默认无，即关闭）
;access-log = /tmp/rtp2httpd-access.log

# 访问日志格式（nginx 风格 $变量）
;log-format = $client_addr [$time_iso8601] "$service_url" $service_type "$upstream_url"

# 守护进程 PID 文件路径（默认无，即关闭）
# 守护进程会锁定该文件、写入 PID，并在正常退出时删除。
# 相对路径以进程工作目录为基准。
;pid-file = /var/run/rtp2httpd.pid

#最大并发客户端数（默认 5）
;maxclients = 5

# UDPxy URL 兼容（默认 yes）
;udpxy = yes

# worker 工作进程数（默认 1）
;workers = 1

# 用于校验 HTTP Host 头的主机名（默认无）
;hostname = somehost.example.com

# 启用后，状态页使用 HTTP X-Forwarded-For 头作为客户端地址（默认 no）
# 仅在反向代理后运行时启用
;xff = no

# HTTP 请求认证令牌（默认无）
# 设置后，所有 HTTP 请求必须携带匹配的 r2h-token 查询参数
;r2h-token = your-secret-token-here

# 状态页路径（默认 /status）
;status-page-path = /status

# 播放器页面路径（默认 /player）
;player-page-path = /player

# 所有 HTTP 资源的公共路径前缀（默认无）
# 当反向代理以 /app/rtp2httpd 这样的前缀转发且不去除前缀时使用
;app-path-prefix = /app/rtp2httpd

# 生成的 M3U 播放列表使用根相对路径（默认 no）
# 启用后，播放列表 URL 省略 http://host 前缀，以 / 或 app-path-prefix 开头
;use-relative-path-in-m3u = no

# 上游媒体流的接口配置
# 所有上游流量的默认接口（优先级最低，未设置专用接口时使用）
;upstream-interface = iptv

# 专用接口（设置后覆盖 upstream-interface）
# 组播（RTP/UDP）流量接口
;upstream-interface-multicast = iptv
# FCC 单播流量接口
;upstream-interface-fcc = iptv
# RTSP 单播流量接口
;upstream-interface-rtsp = iptv
# HTTP 代理流量接口
;upstream-interface-http = iptv

# 优先级：upstream-interface-{multicast,fcc,rtsp,http} > upstream-interface > 路由表

# 外部 M3U 配置
# 从 URL 获取 M3U 播放列表（支持 file://、http://、https://）
# 注意：HTTP/HTTPS 抓取需要已安装 curl 命令
;external-m3u = https://example.com/playlist.m3u
# 或使用本地文件
;external-m3u = file:///path/to/playlist.m3u

# 外部 M3U 更新间隔（秒，默认 7200 = 2 小时）
# 设为 0 关闭自动更新，或设置自定义正数间隔
;external-m3u-update-interval = 7200

# 组播重新加入间隔（秒，默认 0 = 关闭）
# 设置正值（如 60）可周期性重新加入组播组
# 这是针对以下网络的兼容性处理：
# - 启用 IGMP Snooping 的交换机在没有路由器 IGMP Query 时会超时
# - 配置不当导致丢弃组播组成员的网络设备
# 推荐值：30-120 秒（小于常见交换机 260 秒超时）
# 仅在遇到组播流中断时启用
;mcast-rejoin-interval = 0

# FCC 客户端套接字本地 UDP 端口范围（格式：起-止，默认随机端口）
;fcc-listen-port-range = 40000-40100

# 缓冲池最大缓冲数量（默认 16384）
# 每个缓冲 1536 字节，16384 个缓冲约占用 24MB 内存
# 提高该值可提升多客户端并发时的吞吐
;buffer-pool-max-size = 16384

# UDP 套接字接收缓冲区大小（字节，默认 524288 = 512KB）
# 适用于组播、FCC 和 RTSP 的 RTP/RTCP 套接字。
# 约 30Mbps 的 4K IPTV 流，512KB 约提供 140ms 缓冲。
# 高带宽流丢包时可增大该值。
# 实际缓冲大小可能受内核参数 net.core.rmem_max 限制。
;udp-rcvbuf-size = 524288

# 覆盖上游 HTTP 代理请求的 User-Agent 头（默认禁用）
# 设置后，该值将替换发往上游 /http/ 目标的客户端 User-Agent
;http-proxy-user-agent = rtp2httpd-http-proxy/1.0

# 上游 RTSP 请求使用的 User-Agent 头（默认 rtp2httpd/<版本>）
;rtsp-user-agent = rtp2httpd/custom

# 用于 RTSP NAT 穿透的 STUN 服务器（默认禁用）
# 当 RTSP 服务器仅支持 UDP 传输且客户端在 NAT 后时，
# 可尝试 STUN 穿透（不保证成功）
# 格式：host:port 或 host（默认端口 3478）
# 示例：stun.miwifi.com 或 stun.miwifi.com:3478
;rtsp-stun-server = stun.miwifi.com

# CORS 跨域请求配置（默认禁用）
# 设置后启用 CORS 并自动处理 OPTIONS 预检请求
# 设为 * 允许所有来源，或指定域名（如 https://example.com）
;cors-allow-origin = *

# 启用视频截图功能（默认 no）
# 设为 1、yes、true 或 on 启用；否则为 0（关闭）
# 启用后允许客户端通过 snapshot=1 查询参数请求视频截图
;video-snapshot = no

# FFmpeg 可执行文件路径（默认 ffmpeg，即使用系统 PATH）
# 若 ffmpeg 不在 PATH 中或想使用特定版本，请填写完整路径
;ffmpeg-path = /usr/bin/ffmpeg

# 附加 FFmpeg 参数（默认 -hwaccel none）
# 生成截图时这些参数会传给 ffmpeg
# 常用值：-hwaccel none、-hwaccel auto、-hwaccel vaapi、-hwaccel qsv
;ffmpeg-args = -hwaccel none

[bind]
#绑定的 TCP 地址/端口或 Unix 套接字路径列表，例如
;mybox.example.net 5140
;mybox2.example.net 8000
;2001::1 http-alt
;/var/run/rtp2httpd.sock

#注意绑定小于 1024 的端口
#需要 root 权限，因此不推荐。
#（目前尚未实现降权功能）

#以下为默认配置：所有地址，端口 5140
* 5140

[services]
# 除了使用 external-m3u，也可以在下方直接书写 M3U 内容，需以 #EXTM3U 开头
# 示例：
;#EXTM3U x-tvg-url="https://example.com/epg.xml.gz"
;#EXTINF:-1 tvg-id="CCTV1" tvg-name="CCTV1" tvg-logo="https://example.com/logo/CCTV1.png" group-title="央视" catchup="default" catchup-source="rtsp://10.0.0.50:554/catchup?playseek={utc:YmdHMS}-{utcend:YmdHMS}",CCTV-1
;rtp://239.253.64.120:5140
;#EXTINF:-1 tvg-id="CCTV2" tvg-name="CCTV2" group-title="央视",CCTV-2
;rtp://239.253.64.121:5140
;#EXTINF:-1,广东卫视
;rtp://239.194.10.15:1234
